name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build tools
        run: python -m pip install build twine
      - name: Test package
        run: python -m unittest discover -s tests -v
      - name: Build distributions
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check --strict 'dist/*'
      - name: Install the built wheel
        run: >-
          python -c "import pathlib, subprocess, sys;
          wheel, = pathlib.Path('dist').glob('*.whl');
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--no-deps', str(wheel)])"
      - name: Verify new software example
        working-directory: examples/new-software
        run: agent-workflow verify
      - name: Verify data engineering example
        working-directory: examples/data-engineering
        run: agent-workflow verify
