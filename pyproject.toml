[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-workflow"
dynamic = ["version"]
description = "A project-scoped workflow for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
agent-workflow = "agent_workflow.cli:main"

[tool.setuptools]
packages = ["agent_workflow"]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "agent_workflow.__version__"}

[tool.setuptools.package-data]
agent_workflow = [
    "assets/*.md",
    "assets/.agents/skills/*/SKILL.md",
    "assets/.claude/skills/*/SKILL.md",
]
